[workspace]
authors = ["Stefanie Girod <stefanie.girod@rwth-aachen.de>"]
channels = ["conda-forge", "pytorch"]
name = "makerthon"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
pytorch = "2.5.1.*"
torchvision = "0.20.1.*"
pytorch-lightning = "2.6.1.*"
torchmetrics = "1.8.2.*"
numpy = "1.24.3.*"
pandas = "2.3.3.*"
scikit-learn = "1.7.2.*"
scipy = "1.10.1.*"
matplotlib = "3.10.8.*"
seaborn = "0.13.2.*"
tqdm = "4.67.3.*"
pillow = "12.1.1.*"
pyyaml = "6.0.3.*"
requests = "2.32.5.*"
cpuonly = { version = ">=2.0,<3", channel = "pytorch" }
ipython = ">=8.37.0,<9"
keras = ">=3.11.2,<4"
tensorflow = ">=2.18.0,<3"
tensorboard = ">=2.18.0,<3"
optuna = ">=4.8.0,<5"
flask = ">=3.1.3,<4"
qrcode = ">=8.2,<9"
